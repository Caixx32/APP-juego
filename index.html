<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
  <meta name="theme-color" content="#1e1b2e">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <title>Minijuegos para Dos</title>
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div id="app">
    <!-- Pantalla principal -->
    <section id="home" class="screen active">
      <header class="home-header">
        <h1>💞 Minijuegos para Dos</h1>
        <p class="subtitle">Un móvil, dos jugadores</p>
      </header>

      <div class="players">
        <div class="player-card p1">
          <input id="name1" maxlength="12" aria-label="Nombre jugador 1">
          <span class="score" id="score1">0</span>
        </div>
        <div class="vs">vs</div>
        <div class="player-card p2">
          <input id="name2" maxlength="12" aria-label="Nombre jugador 2">
          <span class="score" id="score2">0</span>
        </div>
      </div>

      <div class="game-grid" id="gameGrid"></div>

      <button class="link-btn" id="resetScores">Reiniciar marcador</button>
    </section>

    <!-- Pantalla de juego -->
    <section id="game" class="screen">
      <header class="game-header">
        <button class="icon-btn" id="backBtn" aria-label="Volver">←</button>
        <h2 id="gameTitle"></h2>
        <button class="icon-btn" id="helpBtn" aria-label="Cómo se juega">?</button>
      </header>
      <div id="gameArea"></div>
    </section>

    <!-- Modal -->
    <div id="modal" class="modal hidden">
      <div class="modal-box">
        <div id="modalContent"></div>
        <div class="modal-actions" id="modalActions"></div>
      </div>
    </div>
  </div>

  <script src="js/app.js"></script>
  <script src="js/games/tictactoe.js"></script>
  <script src="js/games/connect4.js"></script>
  <script src="js/games/reflex.js"></script>
  <script src="js/games/memory.js"></script>
  <script src="js/games/rps.js"></script>
  <script src="js/games/tapwar.js"></script>
  <script>App.init();</script>
</body>
</html>
