<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Mi Auto</title>
  <meta name="description" content="Controlá el mantenimiento, los gastos, las multas y los papeles de tu auto.">
  <meta name="theme-color" content="#0b0d10">
  <meta name="color-scheme" content="dark">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Mi Auto">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div id="storage-warning" class="banner" hidden>
    No se pueden guardar datos en este navegador (¿modo privado?). Lo que cargues se perderá al cerrar.
  </div>

  <div id="alert-banner" class="alert-banner" role="alert" hidden></div>

  <section id="stage" class="hero" aria-label="Tu auto">
    <div class="hero-head">
      <div class="hero-title">
        <div class="eyebrow">Mi garage</div>
        <h1 id="car-name">Mi auto</h1>
        <div class="hero-meta">
          <span id="plate" class="plate" hidden></span>
          <span id="hero-km"></span>
          <span id="offline-chip" class="offline-chip" hidden>Sin conexión</span>
        </div>
      </div>
      <button id="status-pill" class="status-pill" type="button"></button>
    </div>

    <div class="viewer">
      <model-viewer id="car3d"
        camera-controls
        disable-pan
        touch-action="pan-y"
        auto-rotate
        auto-rotate-delay="2500"
        rotation-per-second="14deg"
        interaction-prompt="none"
        camera-orbit="-35deg 72deg 125%"
        min-camera-orbit="auto 25deg auto"
        max-camera-orbit="auto 86deg auto"
        environment-image="neutral"
        exposure="1.15"
        shadow-intensity="1.6"
        shadow-softness="0.7">
        <div slot="progress-bar"></div>
      </model-viewer>
      <div class="viewer-hint">Deslizá para girar · tocá un punto</div>
    </div>

    <div id="spot-info" class="spot-info glass" hidden></div>
  </section>

  <main id="view"></main>

  <nav class="tabs glass" aria-label="Secciones">
    <button data-tab="home" class="active"><svg data-icon="home"></svg><span>Inicio</span></button>
    <button data-tab="tasks"><svg data-icon="wrench"></svg><span>Service</span></button>
    <button data-tab="expenses"><svg data-icon="wallet"></svg><span>Gastos</span></button>
    <button data-tab="docs"><svg data-icon="doc"></svg><span>Papeles</span></button>
    <button data-tab="car"><svg data-icon="car"></svg><span>Auto</span></button>
  </nav>

  <dialog id="modal">
    <form id="modal-form" method="dialog">
      <div class="sheet-grip"></div>
      <h2 id="modal-title"></h2>
      <div id="modal-fields"></div>
      <div class="modal-actions">
        <button type="button" id="modal-delete" class="btn danger" hidden>Eliminar</button>
        <span class="spacer"></span>
        <button type="button" id="modal-cancel" class="btn ghost">Cancelar</button>
        <button type="submit" class="btn primary">Guardar</button>
      </div>
    </form>
  </dialog>

  <dialog id="sheet" class="sheet">
    <div class="sheet-grip"></div>
    <div id="sheet-body"></div>
  </dialog>

  <div id="auth-screen" class="auth-screen" hidden>
    <div class="auth-card">
      <div class="auth-logo"><img src="icons/icon-192.png" alt="" width="72" height="72"></div>
      <div class="eyebrow">Mi Auto</div>
      <h1 data-auth-title>Conectando…</h1>
      <p class="sub" data-auth-text></p>
      <div class="auth-spinner" aria-hidden="true"></div>
      <button class="btn primary auth-btn" data-auth-login hidden><svg data-icon="google"></svg>Entrar con Google</button>
      <button class="btn auth-btn" data-auth-retry hidden>Reintentar</button>
    </div>
  </div>

  <input type="file" id="import-file" accept="application/json,.json" hidden>
  <input type="file" id="model-file" accept=".glb,model/gltf-binary" hidden>
  <script type="module" src="vendor/model-viewer.min.js"></script>
  <script src="config.js"></script>
  <script src="cloud.js"></script>
  <script src="store.js"></script>
  <script src="charts.js"></script>
  <script src="app.js"></script>
</body>
</html>
